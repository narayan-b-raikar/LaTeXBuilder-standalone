name: Build Windows program and installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install wxPython pyinstaller accessible-output2
      - run: python -m PyInstaller --noconfirm --clean --windowed --name LaTeXBuilder --collect-all accessible_output2 --add-data "latexBuilder\manual;latexBuilder\manual" app.py
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: LaTeXBuilder-windows
          path: |
            dist/LaTeXBuilder
            installer_output/*.exe
